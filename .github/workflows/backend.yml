name: backend
# Pull requests and main only: every branch push used to run the ~25-minute suite twice.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.event_name }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; main runs always complete (deployments require them).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: colorful_life_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d colorful_life_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:isolated-ci-only@localhost:5432/unused_normal
      TEST_DATABASE_URL: postgresql://test:isolated-ci-only@localhost:5432/colorful_life_test
      JWT_SECRET: synthetic-ci-only-not-production
      STRIPE_SECRET_KEY: sk_test_synthetic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # git show --check needs parents; a shallow boundary is treated as a root.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 -B -m unittest discover -s scripts -p sandbox_disposal_preflight_test.py -v
      - run: npm run test:deployment-contracts
      - run: npm run generate:client
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: npm test
      - run: git diff --exit-code -- prisma/schema.prisma prisma/migrations
      - run: git show --format= --check HEAD
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build API image
        run: docker build --tag colorful-life-backend:ci .
      - name: Verify non-root runtime and production dependencies
        run: >-
          docker run --rm --entrypoint node colorful-life-backend:ci
          --input-type=module -e
          "import assert from 'node:assert/strict'; import {existsSync} from 'node:fs';
          assert.notEqual(process.getuid(), 0);
          for (const name of ['bcrypt', 'pdfkit', 'fontkit', '@prisma/adapter-pg']) await import(name);
          await import('./dist/generated/prisma-client/client.js'); assert.ok(existsSync('dist/index.js')); assert.ok(existsSync('dist/worker.js')); assert.ok(existsSync('certs/rds-ca-rsa2048-g1.pem')); assert.ok(existsSync('src/assets')); assert.ok(existsSync('assets'));
          assert.equal(existsSync('node_modules/typescript'), false); assert.equal(existsSync('node_modules/prisma'), false);"
      - name: Build migration image
        run: docker build --file Dockerfile.migrations --tag colorful-life-migrations:ci .
      - name: Verify non-root migration CLI
        run: >-
          docker run --rm --env DATABASE_URL=postgresql://unused:unused@127.0.0.1/unused
          --entrypoint node colorful-life-migrations:ci --input-type=module -e
          "import assert from 'node:assert/strict'; import {spawnSync} from 'node:child_process';
          assert.notEqual(process.getuid(), 0);
          const result=spawnSync(process.execPath, ['node_modules/prisma/build/index.js', 'validate'], {stdio:'inherit'});
          assert.equal(result.status, 0);"

  deployment-rehearsal:
    # Pinned: needs the preinstalled PostgreSQL 16 binaries (Sandbox major); ubuntu-26.04 images do not ship them.
    runs-on: ubuntu-24.04
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install PostgreSQL 16 rehearsal binaries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16
      - run: test -x /usr/lib/postgresql/16/bin/initdb
      - run: npm ci
      - run: DATABASE_URL=postgresql://unused@127.0.0.1:1/unused npm run generate:client
      - name: Rehearse fresh database, grants and runtime privilege probes
        run: python3 scripts/rehearse-database.py
      - name: Rehearse failed migration and audited owner recovery
        run: python3 scripts/rehearse-database.py --recovery-drill
      - name: Rehearse runtime and Prisma strict TLS
        run: python3 scripts/rehearse-tls.py
      - name: Rehearse populated FBA schema upgrade and restricted-runtime journey
        run: python3 scripts/rehearse-database.py --fba-upgrade --skip-application-tests
      - name: Rehearse populated return-case upgrade and restricted runtime grants
        run: python3 scripts/rehearse-database.py --returns-upgrade --skip-application-tests
      - name: Rehearse single-Admin constraint upgrade with existing accounts
        run: python3 scripts/rehearse-database.py --single-admin-upgrade --skip-application-tests
