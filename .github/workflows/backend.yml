name: backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: colorful_life_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:isolated-ci-only@localhost:5432/unused_normal
      TEST_DATABASE_URL: postgresql://test:isolated-ci-only@localhost:5432/colorful_life_test
      JWT_SECRET: synthetic-ci-only-not-production
      STRIPE_SECRET_KEY: sk_test_synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: npm test
      - run: git diff --exit-code -- prisma/schema.prisma prisma/migrations
      - run: git show --format= --check HEAD
